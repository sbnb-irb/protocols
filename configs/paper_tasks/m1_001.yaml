# Paper Task 4 (Comajuncosa-Creus et al., Nat. Protoc. 2025): a new CC space, M1.001,
# from drug effects on 40 gut bacterial strains (Maier et al. 2018). Equivalent to
# notebooks/M1.001.ipynb.
#
# Run (inside the CC Singularity image, with src/ on PYTHONPATH):
#   python -m chem_checker_protocols fit-signatures --config configs/paper_tasks/m1_001.yaml
#
# Relative paths are resolved against this file's folder. Data: see notebooks/Download_Data.ipynb.

cc_root: ../../local_CC_M1
# cc_config: /path/to/cc_config.json          # or set the CC_CONFIG environment variable
# custom_data_path: /path/to/CC_DATA/DATA     # downloaded reference signatures (Procedure step 3)

datasets:
  - key: m1
    name: Drug-microbiome
    dataset_code: M1.001
    source:
      format: wide_matrix
      path: ../../data/M1/microbiota_raw.csv
    reference_spaces: new_space
