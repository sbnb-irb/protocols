[project]
name = "chemcheck-protocols"
version = "0.1.0"
description = "Chemical Checker protocols: fit, evaluate and compare bioactivity signature spaces."
readme = "README.md"
# Floor matches the Chemical Checker Singularity image (cc.simg, Python 3.10),
# where the package actually runs next to chemicalchecker.
requires-python = ">=3.10"
dependencies = [
    "chemicalchecker>=1.0.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "wget>=3.2",
]

[project.optional-dependencies]
# Docs are built on Read the Docs (Python 3.13); these pins need Python >= 3.12.
docs = [
    "myst-nb>=1.4.0; python_version >= '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "sphinx-autobuild>=2025.8.25; python_version >= '3.12'",
    "sphinx-book-theme>=1.4.0; python_version >= '3.12'",
    "sphinx-copybutton>=0.5.2; python_version >= '3.12'",
    "sphinx-new-tab-link>=0.8.2; python_version >= '3.12'",
    "sphinx-thebe>=0.3.1; python_version >= '3.12'",
    "sphinx-togglebutton>=0.4.5; python_version >= '3.12'",
]
dev = [
    "jupytext>=1.19.5",
    "pytest>=8.1",
]

[project.scripts]
chemcheck-protocols = "chemcheck_protocols.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
