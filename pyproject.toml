[project]
name = "chemical-checker-protocols"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chemicalchecker>=1.0.6",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "wget>=3.2",
]

[project.optional-dependencies]
docs = [
    "jupytext>=1.19.5",
    "myst-nb>=1.4.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-new-tab-link>=0.8.2",
    "sphinx-thebe>=0.3.1",
    "sphinx-togglebutton>=0.4.5",
]
